<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube HLS Streaming Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --bg-card: #12121a; --bg-hover: #1a1a28;
      --border: #1e1e30; --text: #e4e4ef; --dim: #8888a4;
      --accent: #6c5ce7; --glow: rgba(108,92,231,0.25);
      --green: #00e676; --red: #ff5252; --orange: #ff9100;
      --radius: 14px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    .header {
      padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, #ff0000, #ff6b6b, #6c5ce7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-pills { display: flex; gap: 10px; }
    .pill { padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border); }
    .pill.ok { color: var(--green); border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.08); }
    .pill.warn { color: var(--orange); border-color: rgba(255,145,0,0.3); background: rgba(255,145,0,0.08); }

    /* Layout */
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    /* Add Video */
    .add-section { grid-column: 1 / -1; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.5rem; display: flex; gap: 12px; align-items: center; }
    .add-section input {
      flex: 1; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none; transition: border 0.2s;
    }
    .add-section input:focus { border-color: var(--accent); }
    .add-section input::placeholder { color: var(--dim); }
    .btn {
      padding: 10px 20px; border: none; border-radius: 10px; font-family: inherit; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, #ff0000, #ff4444); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,0,0,0.3); }
    .btn-accent { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff; }
    .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--glow); }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; }
    .btn-danger { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* Video Grid */
    .video-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
    .video-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: all 0.3s; cursor: pointer;
    }
    .video-card:hover { border-color: var(--accent); box-shadow: 0 0 25px var(--glow); transform: translateY(-2px); }
    .video-thumb {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111;
      display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 2rem;
      position: relative;
    }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .video-badge {
      position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 6px;
      font-size: 0.65rem; font-weight: 600;
    }
    .badge-ready { background: rgba(0,230,118,0.2); color: var(--green); }
    .badge-processing { background: rgba(108,92,231,0.2); color: var(--accent); }
    .badge-new { background: rgba(255,145,0,0.2); color: var(--orange); }
    .badge-error { background: rgba(255,82,82,0.2); color: var(--red); }
    .video-info { padding: 0.8rem 1rem; }
    .video-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .video-meta { font-size: 0.75rem; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
    .video-actions { display: flex; gap: 6px; margin-top: 8px; }

    /* Player Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      width: 90%; max-width: 960px; overflow: hidden; animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header {
      padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 1rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1.3rem; padding: 4px; }
    .modal-close:hover { color: var(--text); }
    .player-wrap { background: #000; aspect-ratio: 16/9; }
    .player-wrap video { width: 100%; height: 100%; }
    .modal-footer { padding: 0.8rem 1.2rem; font-size: 0.75rem; color: var(--dim); border-top: 1px solid var(--border); word-break: break-all; }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;
      color: var(--dim); font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500; z-index: 2000; animation: slideIn 0.3s ease;
      display: none;
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast.success { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
    .toast.error { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
    .toast.info { background: rgba(108,92,231,0.15); color: var(--accent); border: 1px solid rgba(108,92,231,0.3); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">📺 YouTube HLS Server</div>
    <div class="status-pills">
      <span class="pill" id="pillVideos">0 videos</span>
      <span class="pill" id="pillCached">0 cached</span>
      <span class="pill" id="pillCookies">cookies ?</span>
    </div>
  </div>

  <div class="container">
    <div class="add-section">
      <input type="text" id="videoInput" placeholder="Paste YouTube URL hoặc Video ID (vd: dQw4w9WgXcQ)" onkeydown="if(event.key==='Enter') addVideo()">
      <button class="btn btn-primary" onclick="addVideo()" id="addBtn">+ Thêm Video</button>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- Player Modal -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="playerTitle">Video Player</h3>
        <button class="modal-close" onclick="closePlayer()">✕</button>
      </div>
      <div class="player-wrap">
        <video id="videoPlayer" controls autoplay></video>
      </div>
      <div class="modal-footer" id="playerUrl"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let hlsInstance = null;

    // ====== TOAST ======
    function toast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type}`;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    // ====== LOAD STATUS ======
    async function loadStatus() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        document.getElementById('pillVideos').textContent = `${d.total_videos} videos`;
        document.getElementById('pillVideos').className = `pill ${d.total_videos > 0 ? 'ok' : 'warn'}`;
        document.getElementById('pillCached').textContent = `${d.cached_videos} cached`;
        document.getElementById('pillCached').className = `pill ${d.cached_videos > 0 ? 'ok' : 'warn'}`;
        document.getElementById('pillCookies').textContent = d.cookies_exist ? 'cookies ✅' : 'no cookies';
        document.getElementById('pillCookies').className = `pill ${d.cookies_exist ? 'ok' : 'warn'}`;
      } catch(e) {}
    }

    // ====== LOAD VIDEOS ======
    async function loadVideos() {
      try {
        const r = await fetch('/api/videos');
        const d = await r.json();
        const grid = document.getElementById('videoGrid');

        if (d.videos.length === 0) {
          grid.innerHTML = `<div class="empty-state"><div class="icon">📺</div>Chưa có video nào.<br>Paste YouTube URL ở trên để bắt đầu!</div>`;
          return;
        }

        grid.innerHTML = d.videos.map(v => {
          const statusClass = v.cached ? 'badge-ready' : v.status?.includes('error') ? 'badge-error' : v.status === 'added' ? 'badge-new' : 'badge-processing';
          const statusText = v.cached ? '✅ Ready' : v.status?.includes('error') ? '❌ Error' : v.status === 'added' ? '🆕 New' : '⏳ ' + v.status;

          return `
            <div class="video-card" ondblclick="playVideo('${v.id}')">
              <div class="video-thumb">
                ${v.thumbnail ? `<img src="${v.thumbnail}" alt="" onerror="this.style.display='none'">` : '🎬'}
                <span class="video-badge ${statusClass}">${statusText}</span>
              </div>
              <div class="video-info">
                <div class="video-title">${escapeHtml(v.title || v.id)}</div>
                <div class="video-meta">
                  <span>${v.id}</span>
                  <span>${v.duration || '?'}s</span>
                </div>
                <div class="video-actions">
                  ${v.cached
                    ? `<button class="btn btn-accent btn-sm" onclick="event.stopPropagation(); playVideo('${v.id}')">▶ Play</button>
                       <button class="btn btn-sm" style="background:var(--bg);color:var(--dim);border:1px solid var(--border)" onclick="event.stopPropagation(); copyUrl('${v.id}')">📋 Copy URL</button>`
                    : `<button class="btn btn-accent btn-sm" onclick="event.stopPropagation(); prepareVideo('${v.id}', this)">⚡ Prepare HLS</button>`
                  }
                  <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteVideo('${v.id}')">🗑</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch(e) {
        toast('Failed to load videos', 'error');
      }
    }

    // ====== ADD VIDEO ======
    async function addVideo() {
      const input = document.getElementById('videoInput');
      const val = input.value.trim();
      if (!val) return;

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = 'Adding...';

      try {
        const r = await fetch('/api/videos', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({video_id: val})
        });
        const d = await r.json();

        if (d.success) {
          toast(`✅ Added: ${d.title}`, 'success');
          input.value = '';
          loadVideos();
          loadStatus();
        } else {
          toast(`❌ ${d.error}`, 'error');
        }
      } catch(e) {
        toast('Connection error', 'error');
      }

      btn.disabled = false;
      btn.textContent = '+ Thêm Video';
    }

    // ====== PREPARE VIDEO ======
    async function prepareVideo(id, btn) {
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Processing...'; }
      toast('🔄 Extracting & transcoding... (có thể mất vài phút)', 'info');

      try {
        const r = await fetch(`/api/prepare/${id}`, {method: 'POST'});
        const d = await r.json();

        if (d.success || d.cached) {
          toast('✅ HLS ready!', 'success');
          loadVideos();
          loadStatus();
        } else if (d.status === 'processing') {
          toast('⏳ Đang xử lý...', 'info');
        } else {
          toast(`❌ ${d.error}`, 'error');
        }
      } catch(e) {
        toast('Connection error', 'error');
      }

      if (btn) { btn.disabled = false; btn.textContent = '⚡ Prepare HLS'; }
    }

    // ====== PLAY VIDEO ======
    function playVideo(id) {
      const url = `/hls/${id}/index.m3u8`;
      const video = document.getElementById('videoPlayer');

      document.getElementById('playerTitle').textContent = id;
      document.getElementById('playerUrl').innerHTML = `<strong>HLS URL:</strong> ${location.origin}${url}`;
      document.getElementById('playerModal').classList.add('active');

      if (hlsInstance) { hlsInstance.destroy(); }

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('active');
      const video = document.getElementById('videoPlayer');
      video.pause(); video.src = '';
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    }

    // ====== COPY URL ======
    function copyUrl(id) {
      const url = `${location.origin}/hls/${id}/index.m3u8`;
      navigator.clipboard.writeText(url).then(() => toast('📋 Copied HLS URL!', 'success'));
    }

    // ====== DELETE ======
    async function deleteVideo(id) {
      if (!confirm(`Xóa video ${id}?`)) return;
      try {
        await fetch(`/api/videos/${id}`, {method: 'DELETE'});
        toast('🗑 Deleted', 'info');
        loadVideos();
        loadStatus();
      } catch(e) { toast('Error', 'error'); }
    }

    // ====== UTILS ======
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Close modal on backdrop click
    document.getElementById('playerModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closePlayer();
    });

    // Init
    loadStatus();
    loadVideos();
    setInterval(loadStatus, 10000);
  </script>
</body>
</html>
